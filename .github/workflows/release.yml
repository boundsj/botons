name: Release

# Publishes getbotons to npm when a v* tag is pushed, through npm trusted
# publishing (OIDC): no npm token is stored anywhere. Public repository only.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish, for example v0.1.1
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - name: Tag matches package version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "v$version" ]; then echo "Tag $TAG does not match package.json version $version"; exit 1; fi
      - run: npm ci --no-audit --no-fund
      - run: npm run release:package
      # Staged: the version waits on npmjs.com until the owner approves it with 2FA.
      - run: npm stage publish ./release-package --provenance --access public
