name: Public

# Keeps the repo publishable (see AGENTS.md): every file, plus a pull request's commits, title and
# description. Runs apart from CI, on every pull request whatever it changes, so editing a description
# re-checks only this.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check:public
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Values reach the shell through env, never inline, so a title can't inject commands.
      - env:
          BASE: ${{ github.base_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/check-public.ts --commits "origin/$BASE..HEAD" --text PR_TITLE --text PR_BODY
