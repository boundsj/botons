<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0b0f19" />
    <meta name="color-scheme" content="light dark" />
    <script>// Runs synchronously in the head, before styles or React, and owns only DOM paints.
(() => {
  const key = 'botons.theme';
  // How dark looks: the usual blue-black, or ultra black (true black, data-dark-style="black"). Its own key, so a
  // build that doesn't know it shows its usual dark, and the appearance choice reads the same everywhere.
  const styleKey = 'botons.darkStyle';
  // The same choice under its earlier key, taken over once (the build fills it in from shared/legacy-names.mjs).
  const earlier = '__EARLIER_THEME_KEY__';
  const valid = value => ['system', 'light', 'dark'].includes(value) ? value : 'system';
  const validStyle = value => value === 'black' ? 'black' : 'dark';
  const media = matchMedia('(prefers-color-scheme: dark)');
  let preference = 'system';
  let darkStyle = 'dark';
  try {
    let saved = localStorage.getItem(key);
    if (saved === null && earlier && !earlier.startsWith('__')) {
      saved = localStorage.getItem(earlier);
      if (saved !== null) { localStorage.setItem(key, saved); localStorage.removeItem(earlier); }
    }
    preference = valid(saved);
    darkStyle = validStyle(localStorage.getItem(styleKey));
  } catch { /* Storage can be blocked. */ }
  const apply = () => {
    const theme = preference === 'system' ? (media.matches ? 'dark' : 'light') : preference;
    const root = document.documentElement;
    root.dataset.theme = theme;
    // Ultra black only ever changes dark: System follows the device, and is ultra black at night.
    if (theme === 'dark' && darkStyle === 'black') root.dataset.darkStyle = 'black';
    else delete root.dataset.darkStyle;
    root.style.colorScheme = theme;
    document.querySelector('meta[name="color-scheme"]').content = theme;
    document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? (darkStyle === 'black' ? '#000000' : '#0b0f19') : '#ffffff';
  };
  const changed = () => { apply(); dispatchEvent(new Event('botons-theme')); };
  window.botonsTheme = {
    get: () => preference,
    set: value => {
      preference = valid(value);
      try { localStorage.setItem(key, preference); } catch { /* Keep working for this page. */ }
      changed();
    },
    darkStyle: () => darkStyle,
    setDarkStyle: value => {
      darkStyle = validStyle(value);
      try { localStorage.setItem(styleKey, darkStyle); } catch { /* Keep working for this page. */ }
      changed();
    },
  };
  media.addEventListener('change', apply);
  addEventListener('storage', event => {
    if (event.key === key || event.key === null) preference = valid(event.key === null ? null : event.newValue);
    if (event.key === styleKey || event.key === null) darkStyle = validStyle(event.key === null ? null : event.newValue);
    if (event.key === key || event.key === styleKey || event.key === null) changed();
  });
  apply();
})();
</script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Botons</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
